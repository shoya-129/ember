[package]
name = "embereng"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = "0.25.10"
minifb = "0.28.0"
once_cell = "1.21.4"
rodio = "0.22.2"
flame-macro = "0.1.0"
font8x8 = "0.3.1"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
